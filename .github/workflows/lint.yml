# Goal: When someone changes Python code,
# the linter checks syntax, formatting, and code quality.

name: Automation

on:
  push:
    paths:
      - "*.py"

jobs:
  code:
    runs-on: ubuntu-latest

    steps:
      # Clone the repository code
      - name: Checkout/Clone the code
        uses: actions/checkout@v4

      # Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.14'

      # Install Ruff linter
      - name: Install Linter
        run: pip install ruff

      # Run linting checks
      - name: Run Linter
        run: ruff check .
